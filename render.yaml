services:
  - type: web
    name: docs-lite
    runtime: docker
    plan: free # free tier: no persistent disk, so the database resets on restart (demo accounts are re-seeded). For persistence use plan: starter and add a disk mounted at /data.
    healthCheckPath: /readyz
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: METRICS_TOKEN
        generateValue: true
