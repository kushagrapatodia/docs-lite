name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t docs-lite .
      - run: |
          docker run -d --name app -p 3000:3000 docs-lite
          for i in $(seq 1 20); do curl -fs localhost:3000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
